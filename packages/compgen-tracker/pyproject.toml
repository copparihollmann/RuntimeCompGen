[project]
name = "compgen-tracker"
version = "0.1.0"
description = "Standalone Gemini API usage + cost + budget tracker"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "CompGen Contributors" },
]
keywords = ["gemini", "tracking", "cost", "observability", "budget"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
# Deliberately lean: no torch, no xdsl, no compiler-pipeline deps.
# Just what the JSONL ledger + Rich dashboard need.
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
# Pricing-override YAML is opt-in.
yaml = ["pyyaml>=6.0"]
# google-genai instrumentation only matters if you use the SDK.
genai = ["google-genai>=1.0"]
# OpenAI-compat instrumentation hook (the Gemini OpenAI-compat
# endpoint travels through openai.AsyncOpenAI for some callers).
openai = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
compgen-gemini-usage = "compgen_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compgen_tracker"]

[tool.ruff]
line-length = 120
target-version = "py311"
